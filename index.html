<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FahzGPT Information</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
width:90%;
max-width:800px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
padding:30px;
border-radius:20px;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.title{
font-size:30px;
font-weight:600;
}

.card{
margin-top:20px;
padding:20px;
border-radius:14px;
background:rgba(255,255,255,0.06);
}

.badge{
padding:6px 16px;
border-radius:20px;
font-weight:600;
}

.active{background:#22c55e;}
.offline{background:#ef4444;}
.error{background:#f59e0b;}
.update{background:#3b82f6;}

.debug{
background:#020617;
padding:15px;
border-radius:10px;
font-family:monospace;
margin-top:10px;
white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<div class="title">FahzGPT Information</div>

<div class="card">
Server Status

<div style="margin-top:10px;">
<span id="status" class="badge">Loading...</span>
</div>

</div>

<div class="card">
Pengumuman

<div id="announcement" class="debug">
Loading announcement...
</div>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAvmNVsEKYsZ00qjZIbF92aoNPGhjlurpc",
authDomain: "debug-ai-da648.firebaseapp.com",
databaseURL: "https://debug-ai-da648-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "debug-ai-da648",
storageBucket: "debug-ai-da648.firebasestorage.app",
messagingSenderId: "801152011345",
appId: "1:801152011345:web:f961fa88389eb86591fc70"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const statusEl = document.getElementById("status");
const annEl = document.getElementById("announcement");

const serverRef = ref(db,"server");

onValue(serverRef,(snapshot)=>{

const data = snapshot.val();

if(!data) return;

statusEl.className="badge";

if(data.status==="aktif"){
statusEl.classList.add("active");
statusEl.innerText="Aktif";
}

if(data.status==="mati"){
statusEl.classList.add("offline");
statusEl.innerText="Mati";
}

if(data.status==="error"){
statusEl.classList.add("error");
statusEl.innerText="Error";
}

if(data.status==="update"){
statusEl.classList.add("update");
statusEl.innerText="Update";
}

annEl.innerText=data.announcement;

});

</script>

</body>
</html>
